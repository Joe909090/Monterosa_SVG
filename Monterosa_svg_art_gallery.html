
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven SVG Art Combinations</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        text-align: center;
        padding: 20px;
    }
    h1 { color: #243447; }
    .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    .art {
        background: white;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0 3px 10px #0002;
    }
    svg {
        width: 200px;
        height: 300px;
        border: 1px solid #ddd;
        background: #fffdf7;
    }
</style>
</head>
<body>

<h1>Seven SVG Art Combinations</h1>

<div class="gallery">

<!-- 1. Line and Circle -->
<div class="art">
<h3>1. Line and Circle</h3>
<svg width="200" height="300">
    <line x1="20" y1="150" x2="180" y2="150"
          stroke="blue" stroke-width="5"/>
    <line x1="100" y1="30" x2="100" y2="270"
          stroke="orange" stroke-width="4"/>
    <circle cx="100" cy="150" r="55"
            fill="lightblue" stroke="navy" stroke-width="4"/>
    <circle cx="100" cy="150" r="20"
            fill="yellow" stroke="red" stroke-width="3"/>
</svg>
</div>

<!-- 2. Circle and Rectangle -->
<div class="art">
<h3>2. Circle and Rectangle</h3>
<svg width="200" height="300">
    <rect x="35" y="55" width="130" height="190"
          rx="12" fill="lightgreen"
          stroke="green" stroke-width="4"/>
    <circle cx="100" cy="105" r="35"
            fill="orange" stroke="red" stroke-width="4"/>
    <circle cx="100" cy="195" r="28"
            fill="skyblue" stroke="blue" stroke-width="4"/>
</svg>
</div>

<!-- 3. Polyline and Circle -->
<div class="art">
<h3>3. Polyline and Circle</h3>
<svg width="200" height="300">
    <polyline points="20,230 55,170 90,210 130,90 180,130"
              fill="none" stroke="purple"
              stroke-width="5" stroke-linejoin="round"/>
    <circle cx="55" cy="170" r="22" fill="red"/>
    <circle cx="130" cy="90" r="25" fill="gold"/>
    <circle cx="180" cy="130" r="15" fill="cyan"/>
</svg>
</div>

<!-- 4. Polygon and Ellipse -->
<div class="art">
<h3>4. Polygon and Ellipse</h3>
<svg width="200" height="300">
    <polygon points="100,30 175,100 150,210 50,210 25,100"
             fill="pink" stroke="purple" stroke-width="4"/>
    <ellipse cx="100" cy="130" rx="48" ry="75"
             fill="orange" stroke="red" stroke-width="4"/>
    <ellipse cx="100" cy="130" rx="20" ry="45"
             fill="yellow"/>
</svg>
</div>

<!-- 5. Circle, Line and Rectangle -->
<div class="art">
<h3>5. Circle, Line and Rectangle</h3>
<svg width="200" height="300">
    <rect x="40" y="90" width="120" height="130"
          fill="lightblue" stroke="blue" stroke-width="4"/>
    <line x1="100" y1="20" x2="100" y2="270"
          stroke="red" stroke-width="5"/>
    <line x1="15" y1="155" x2="185" y2="155"
          stroke="green" stroke-width="4"/>
    <circle cx="100" cy="155" r="42"
            fill="yellow" stroke="orange" stroke-width="4"/>
</svg>
</div>

<!-- 6. Polyline and Polygon -->
<div class="art">
<h3>6. Polyline and Polygon</h3>
<svg width="200" height="300">
    <polygon points="100,35 175,100 150,200 50,200 25,100"
             fill="lightgreen" stroke="green" stroke-width="4"/>
    <polyline points="20,245 55,195 85,245 115,195 145,245 180,195"
              fill="none" stroke="red"
              stroke-width="5" stroke-linejoin="round"/>
    <polygon points="100,80 125,125 75,125"
             fill="gold" stroke="orange" stroke-width="3"/>
</svg>
</div>

<!-- 7. All Five Shapes -->
<div class="art">
<h3>7. All Five Shapes</h3>
<svg width="200" height="300">
    <rect x="20" y="35" width="160" height="230"
          rx="10" fill="#e6e6fa"
          stroke="purple" stroke-width="3"/>

    <polygon points="100,45 155,100 100,155 45,100"
             fill="pink" stroke="red" stroke-width="3"/>

    <ellipse cx="100" cy="100" rx="25" ry="40"
             fill="orange" stroke="darkorange" stroke-width="3"/>

    <polyline points="25,220 60,170 95,220 130,170 175,220"
              fill="none" stroke="blue" stroke-width="4"/>

    <line x1="25" y1="150" x2="175" y2="150"
          stroke="green" stroke-width="4"/>

    <circle cx="100" cy="150" r="25"
            fill="yellow" stroke="red" stroke-width="3"/>

    <circle cx="60" cy="245" r="12" fill="red"/>
    <circle cx="140" cy="245" r="12" fill="blue"/>
</svg>
</div>

</div>
</body>
</html>
